<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Employee Management</title>

    <style>

        :root {
            --bg: #f3f5f8;
            --card: #ffffff;
            --text: #1e2a3a;
            --muted: #6b7788;
            --line: #dde3ea;
            --accent: #1f6f78;
            --accent-dark: #17555c;
            --ok-bg: #e3f4ea;
            --ok-text: #1b6b3a;
            --err-bg: #fbe6e6;
            --err-text: #a12626;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 16px;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 24px;
            font-size: 28px;
        }

        h2 {
            margin: 0 0 16px;
            font-size: 18px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
        }

       

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 4px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
        }

        input:focus {
            outline: 2px solid var(--accent);
            outline-offset: 0;
            border-color: var(--accent);
        }

  

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
            cursor: pointer;
            background: var(--accent);
            color: #fff;
        }

        button:hover {
            background: var(--accent-dark);
        }

        button:focus-visible {
            outline: 2px solid var(--accent-dark);
            outline-offset: 2px;
        }

        button.secondary {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        button.secondary:hover {
            background: #e6f1f2;
        }

        button.danger {
            background: #b83232;
        }

        button.danger:hover {
            background: #8f2525;
        }

        button.small {
            padding: 6px 12px;
            font-size: 13px;
        }

        .row-actions {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }

        .actions {
            margin-top: 18px;
            display: flex;
            gap: 10px;
        }



        .message {
            display: none;
            margin-top: 16px;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 14px;
        }

        .message.ok {
            display: block;
            background: var(--ok-bg);
            color: var(--ok-text);
        }

        .message.error {
            display: block;
            background: var(--err-bg);
            color: var(--err-text);
        }

    

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .list-header h2 {
            margin: 0;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--line);
        }

        th {
            font-size: 13px;
            color: var(--muted);
            font-weight: 600;
            background: #f8fafb;
        }

        td.number,
        th.number {
            text-align: right;
        }

        tbody tr:hover {
            background: #f8fafb;
        }

        .empty {
            text-align: center;
            color: var(--muted);
            padding: 28px 12px;
        }

        @media (max-width: 560px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>Employee Management</h1>


   
        <div class="card">

            <h2 id="formTitle">Add employee</h2>

            <input type="hidden" id="employeeId">

            <div class="form-grid">

                <div>
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Juan Dela Cruz">
                </div>

                <div>
                    <label for="position">Position</label>
                    <input type="text" id="position" placeholder="Accountant">
                </div>

                <div>
                    <label for="department">Department</label>
                    <input type="text" id="department" placeholder="Finance">
                </div>

                <div>
                    <label for="salary">Salary</label>
                    <input type="number" id="salary" placeholder="25000" step="0.01" min="0">
                </div>

            </div>

            <div class="actions">
                <button id="submitBtn" onclick="addEmployee()">Add employee</button>
                <button id="cancelBtn" class="secondary" onclick="cancelEdit()" style="display:none">Cancel</button>
            </div>

            <div id="message" class="message"></div>

        </div>


   

        <div class="card">

            <div class="list-header">
                <h2>Employees</h2>
                <button class="secondary" onclick="loadEmployees()">Refresh list</button>
            </div>

            <div class="table-wrap">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Position</th>
                            <th>Department</th>
                            <th class="number">Salary</th>
                            <th class="number">Actions</th>
                        </tr>
                    </thead>

                    <tbody id="employeeTable"></tbody>

                </table>

            </div>

        </div>

    </div>


    <script>

       
        function escapeHtml(value) {
            const div = document.createElement("div");
            div.textContent = value;
            return div.innerHTML;
        }


     
        let loadedEmployees = [];


        function showMessage(text, type) {
            const box = document.getElementById("message");
            box.textContent = text;
            box.className = "message " + type;
        }


        async function loadEmployees() {

            const table = document.getElementById("employeeTable");

            try {

                const response = await fetch("/api/employees");

                if (!response.ok) throw new Error();

                const employees = await response.json();
                loadedEmployees = employees;

                if (employees.length === 0) {
                    table.innerHTML = `
                        <tr>
                            <td colspan="6" class="empty">
                                No employees yet. Add the first one above.
                            </td>
                        </tr>
                    `;
                    return;
                }

                table.innerHTML = employees.map(employee => `
                    <tr>
                        <td>${employee.id}</td>
                        <td>${escapeHtml(employee.name)}</td>
                        <td>${escapeHtml(employee.position)}</td>
                        <td>${escapeHtml(employee.department)}</td>
                        <td class="number">${Number(employee.salary).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
                        <td class="number">
                            <div class="row-actions">
                                <button class="secondary small" onclick="editEmployee(${employee.id})">Edit</button>
                                <button class="danger small" onclick="deleteEmployee(${employee.id})">Delete</button>
                            </div>
                        </td>
                    </tr>
                `).join("");

            } catch (error) {

                table.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty">
                            Could not load employees. Check that the server and database are running.
                        </td>
                    </tr>
                `;

            }

        }


  
        async function addEmployee() {

            const employee = {
                name: document.getElementById("name").value.trim(),
                position: document.getElementById("position").value.trim(),
                department: document.getElementById("department").value.trim(),
                salary: document.getElementById("salary").value
            };

            const editId = document.getElementById("employeeId").value;

            try {

                const response = await fetch(editId ? "/api/employees/" + editId : "/api/employees", {
                    method: editId ? "PUT" : "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(employee)
                });

                const result = await response.json();

                if (!response.ok) {
                    showMessage(result.message, "error");
                    return;
                }

                showMessage(result.message, "ok");

                cancelEdit();

                loadEmployees();

            } catch (error) {

                showMessage("Could not reach the server.", "error");

            }

        }


   
        function editEmployee(id) {

            const employee = loadedEmployees.find(e => e.id === id);
            if (!employee) return;

            document.getElementById("employeeId").value = employee.id;
            document.getElementById("name").value = employee.name;
            document.getElementById("position").value = employee.position;
            document.getElementById("department").value = employee.department;
            document.getElementById("salary").value = employee.salary;

            document.getElementById("formTitle").textContent = "Edit employee #" + employee.id;
            document.getElementById("submitBtn").textContent = "Save changes";
            document.getElementById("cancelBtn").style.display = "";

            window.scrollTo({ top: 0, behavior: "smooth" });

        }


        function cancelEdit() {

            ["employeeId", "name", "position", "department", "salary"].forEach(id => {
                document.getElementById(id).value = "";
            });

            document.getElementById("formTitle").textContent = "Add employee";
            document.getElementById("submitBtn").textContent = "Add employee";
            document.getElementById("cancelBtn").style.display = "none";

        }


        async function deleteEmployee(id) {

            if (!confirm("Delete this employee? This cannot be undone.")) return;

            try {

                const response = await fetch("/api/employees/" + id, {
                    method: "DELETE"
                });

                const result = await response.json();

                if (!response.ok) {
                    showMessage(result.message, "error");
                    return;
                }

                if (document.getElementById("employeeId").value == id) cancelEdit();

                showMessage(result.message, "ok");
                loadEmployees();

            } catch (error) {

                showMessage("Could not reach the server.", "error");

            }

        }


    
        loadEmployees();

    </script>

</body>

</html>
